'ISP.BasicStructure:Page':
  superTypes:
    'Neos.Neos:Document': true
  ui:
    icon: file
    label: 'Basic Startseite'
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
    'slider':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': FALSE
          'ISP.BasicStructure:Carousel': TRUE
          'Neos.NodeTypes:Image': TRUE
          'Neos.NodeTypes:TextWithImage': TRUE
    'content':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'content2':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'content3':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'content4':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'TopContact':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': FALSE
          'Neos.NodeTypes:Text': TRUE
    'footer':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': FALSE
          'Neos.NodeTypes:Headline': TRUE
          'Neos.NodeTypes:Text': TRUE
          'Neos.NodeTypes:Image': TRUE
          'Neos.NodeTypes:TwoColumn': TRUE
          'Neos.NodeTypes:ThreeColumn': TRUE
'ISP.BasicStructure:ContentPage':
  superTypes:
    'ISP.BasicStructure:Page': true
  ui:
    icon: 'icon-file'
    label: 'Basic Inhaltsseite'
    group: 'general'
'ISP.BasicStructure:OnePage':
  superTypes:
    'Neos.Neos:Document': true
  constraints:
    nodeTypes:
      '*': false
      'Neos.Neos:Shortcut': true
  ui:
    icon: file
    label: 'OnePager'
    inspector:
      groups:
        colors:
          label: Farben
          icon: 'icon-palette'
          position: 1100
          collapsed: true
        logo:
          label: Logo
          icon: 'icon-image'
          position: 1200
          collapsed: true
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
    'slider':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': FALSE
          'ISP.OnePage:Carousel': TRUE
          'Neos.NodeTypes:Image': TRUE
          'Neos.NodeTypes:TextWithImage': TRUE
    'content':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'content2':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'content3':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'content4':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': TRUE
    'TopContact':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': FALSE
          'Neos.NodeTypes:Text': TRUE
    'footer':
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': FALSE
          'Neos.NodeTypes:Headline': TRUE
          'Neos.NodeTypes:Text': TRUE
          'Neos.NodeTypes:Image': TRUE
          'Neos.NodeTypes:TwoColumn': TRUE
          'Neos.NodeTypes:ThreeColumn': TRUE
  properties:
    logo:
      type: Neos\Media\Domain\Model\ImageInterface
      ui:
        label: Logo
        reloadIfChanged: TRUE
        inspector:
          group: 'logo'
          position: 0    
    cr:
      type: string
      defaultValue: 'Copyright © 2023 • Lorem Ipsum'
      ui:
        inlineEditable: true
        inspector:
          group: null
        aloha:
          placeholder: 'Hier Ort eingeben...'
          format:
            b: false
            i: false
            u: false
            sub: false
            sup: false
            p: true
            h1: false
            h2: false
            h3: false
            pre: false
            removeFormat: false
          table: { }
          list: { }
          link:
            a: true
          alignment: { }
    topColor:
      type: string
      ui:
        showInCreationDialog: true    
        reloadIfChanged: true  
        label: 'Farbwahl'
        inspector:
          group: 'general'
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              orange:
                label: 'Orange & Yellow'
                icon: 'resource://ISP.BasicStructures/Icons/orange.svg'
              fuchsia:
                label: 'Fuchsia & Dark Grey'
                icon: 'resource://ISP.BasicStructures/Icons/fuchsia.svg'
              green:
                label: 'Green & Red & White'
                icon: 'resource://ISP.BasicStructures/Icons/green.svg'
              pink:
                label: 'Pink & Teal & Cream'
                icon: 'resource://ISP.BasicStructures/Icons/pink.svg'
              cream:
                label: 'Cream & Black'
                icon: 'resource://ISP.BasicStructures/Icons/cream.svg'
              jungle:
                label: 'Green & Tangerine Yellow & Ivory'
                icon: 'resource://ISP.BasicStructures/Icons/jungle.svg'
